services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      - minio
    ports:
      - "8000:8000"
    environment:
      R2_ENDPOINT: http://minio:9000
      R2_ACCOUNT_ID: local
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: ff-test
      R2_PUBLIC_BASE_URL: http://minio:9000/ff-test
    command: ["python3", "-u", "runpod_serverless/handler.py", "--rp_serve_api", "--rp_api_host", "0.0.0.0", "--rp_api_port", "8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
